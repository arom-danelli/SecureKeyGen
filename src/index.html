<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Conversor de Certificados PFX e CRT</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>SECURE KEYGEN</h1>
      <h2>Conversor de certificados PFX E CRT</h2>
    </header>
    <main>
      <div class="file-drop-container" id="file-drop">
        <div class="file-input-container">
          <input type="file" id="fileInput" hidden multiple>
          <button id="fileSelect">Inserir Documentos</button>
        </div>
        <p>Arraste o arquivo aqui ou clique no botão acima.</p>
        <p class="file-types">*Arquivos aceitos: .crt + .key</p>
      </div>
      <button id="convertButton">Converter Arquivos</button>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
