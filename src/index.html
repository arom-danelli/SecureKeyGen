<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <title>Conversor de Certificados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Conversor de Certificados</h2>
        <input type="file" id="fileInput" multiple>
        <div class="conversion-options">
            <input type="radio" id="pfxToCrtKey" name="conversionType" value="pfxToCrtKey" checked>
            <label for="pfxToCrtKey">PFX para CRT e KEY</label>

            <input type="radio" id="crtKeyToPfx" name="conversionType" value="crtKeyToPfx">
            <label for="crtKeyToPfx">CRT e KEY para PFX</label>
        </div>
        <button id="convertButton">Converter</button>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
