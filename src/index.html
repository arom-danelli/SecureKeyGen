<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://cdn.jsdelivr.net;">
  <meta charset="UTF-8" />
  <title>Conversor de Certificados PFX e CRT</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1>SECURE KEYGEN</h1>
      <img src="./assets/icons/shield_lock.svg" alt="Bootstrap" width="100" height="50" />
      <h2 class="text-center">Conversor de certificados PFX e CRT</h2>
    </header>
    <main>
      <!-- Botões de seleção de conversão -->
      <button id="toPFXButton" class="btn btn-primary">PFX</button>
      <button id="toCRTButton" class="btn btn-primary">CRT</button>

      <!-- Container para arrastar e soltar arquivos, com lista de arquivos selecionados -->
      <div class="file-drop-container box" id="file-drop">
        <p>Arraste os arquivos e solte-os aqui!</p>
        <p>ou</p>
        <div class="container text-center">
          <!-- Lista de arquivos selecionados -->
          <div id="fileList" class="file-list">Arquivos selecionados aparecerão aqui</div>
        </div>
        <div class="file-input-container">
          <input type="file" id="fileInput" hidden multiple />
          <button id="fileSelect">Inserir Documentos</button>
        </div>
        <p id="file-types" class="file-types">*Arquivos aceitos: .CRT + .KEY</p>
      </div>

      <!-- Área para exibição do arquivo selecionado e botão para removê-lo -->
      <div id="selectedFileContainer" class="hidden selected-file">
        <span id="selectedFileName"></span>
        <button id="removeFileButton">&times;</button>
      </div>

      <!-- Botão de conversão -->
      <button id="convertButton" class="btn btn-primary">
        Converter Arquivos
      </button>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
