<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://cdn.jsdelivr.net;">
  <meta charset="UTF-8" />
  <title>Conversor de Certificados PFX e CRT</title>
  <link rel="stylesheet" type="text/css" href="style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>
<body>
  <div class="app-container">
    <header>
      <div class="header-content">
        <img src="./assets/icons/shield_lock.svg" alt="Secure Keygen" width="50" height="50" />
        <h1>SECURE KEYGEN</h1>
        <h2>Conversor de certificados PFX e CRT</h2>
      </div>
    </header>
    <main>
      <div class="conversion-type-tabs">
        <button id="toPFXButton" class="btn btn-primary">PFX</button>
        <button id="toCRTButton" class="btn btn-secondary">CRT</button>
      </div>
      <div class="main-content">
        <div class="file-drop-container box" id="file-drop">
          <p>Arraste o arquivo aqui!</p>
          <p>ou</p>
          <button id="fileSelect" class="btn btn-primary">Inserir Documentos</button>
          <input type="file" id="fileInput" hidden multiple />
          <p class="file-types">*Arquivos aceitos: <span id="accepted-file-types">.crt + .key</span></p>
        </div>
        <div id="fileListContainer" class="file-list-container">
          <div id="fileList" class="file-list"></div>
          <button id="convertButton" class="btn btn-primary">Converter Arquivos</button>
        </div>
        <div id="feedbackMessage" class="feedback-message"></div>
      </div>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
