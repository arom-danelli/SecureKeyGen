<!DOCTYPE html>
<html>
<head>
    <title>Insira a Senha</title>
    <link rel="stylesheet" type="text/css" href="stylepassword.css">
</head>
<body>
    <div>
        <h1>Por favor, insira a senha do certificado</h1>
        <input type="password" id="password" placeholder="Senha">
        <button onclick="submitPassword()">OK</button>
        <button onclick="cancel()">Cancelar</button> 
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        function submitPassword() {
            const password = document.getElementById('password').value;
            ipcRenderer.send('password-submitted', password);
        }

        function cancel() {
            window.close(); 
        }
    </script>
</body>
</html>
