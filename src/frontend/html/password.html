<!DOCTYPE html>
<html>
<head>
  <title>Insira a Senha</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" type="text/css" href="../css/stylepassword.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"> <!-- Link para a fonte Roboto -->
</head>
<body>
  <div class="app-container">
    <header class="draggable">
      <div class="header-content">
        <div class="header-text">
          <h1 id="password-title">Insira a Senha</h1>
        </div>
        <div class="window-controls">
          <button id="close-button">X</button>
        </div>
      </div>
    </header>
    <div class="password-container">
      <h1 id="password-prompt">Por favor, insira a senha do certificado</h1>
      <p id="additional-info" style="display: none; color: #4a148c;"></p>
      <input type="password" id="password">
      <button id="submit-button" class="btn btn-primary">OK</button>
    </div>
  </div>
  <script src="../js/password.js"></script>
</body>
</html>
