<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Conversor de Certificados PFX e CRT</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;" />
  <link rel="stylesheet" type="text/css" href="../css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>
<body>
  <div class="app-container">
    <header class="draggable">
      <div class="header-content">
        <img src="../../assets/icons/shield_lock.svg" alt="Secure Keygen" class="header-icon" />
        <div class="header-text">
          <h1>SECURE KEYGEN</h1>
          <h2>Conversor de certificados PFX e CRT</h2>
        </div>
        <div class="window-controls">
          <img src="../../assets/icons/settings.svg" alt="Settings" id="settings-icon" class="settings-icon" />
          <span class="divider">|</span>
          <button id="minimize-button">_</button>
          <button id="close-button">X</button>
        </div>
      </div>
    </header>
    <main>
      <div class="main-content">
        <div class="conversion-type-tabs">
          <button id="toPFXButton" class="btn btn-primary active">PFX</button>
          <button id="toCRTButton" class="btn btn-secondary">CRT</button>
        </div>
        <div class="file-drop-container box" id="file-drop">
          <p id="conversion-type-text">Converter para PFX</p>
          <p>Arraste o arquivo aqui!</p>
          <p>ou</p>
          <button id="fileSelect" class="btn btn-primary">
            <strong>Inserir Documentos</strong>
          </button>
          <input type="file" id="fileInput" hidden multiple />
          <p class="file-types" id="file-types-text"></p>
        </div>
        <div id="fileListContainer" class="file-list-container">
          <div id="fileList" class="file-list"></div>
          <button id="convertButton" class="btn btn-primary center-button">
            Converter Arquivos
          </button>
        </div>
        <div id="feedbackMessage" class="feedback-message"></div>
      </div>
    </main>
    <footer class="footer">
      <span>Powered by:</span>
      <img src="../../assets/logo.png" alt="Company Logo" class="company-logo" />
      <span>&nbsp;&nbsp;| </span>
      <img src="../../assets/logo_unicv.png" alt="Another Company Logo" class="company-logo" />
    </footer>
  </div>
  <script src="../js/renderer.js"></script>
</body>
</html>
